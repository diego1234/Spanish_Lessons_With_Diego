<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padre e Hija</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --bg: oklch(98% 0.004 240);
  --surface: oklch(100% 0 0);
  --fg: oklch(20% 0.02 240);
  --muted: oklch(50% 0.018 240);
  --border: oklch(90% 0.006 240);
  --accent: oklch(56% 0.12 170);
  --accent-light: oklch(92% 0.04 170);
  --accent-dark: oklch(42% 0.14 170);
  --success: oklch(55% 0.15 145);
  --success-light: oklch(92% 0.04 145);
  --warn: oklch(70% 0.14 75);
  --warn-light: oklch(93% 0.04 75);
  --danger: oklch(55% 0.18 25);
  --danger-light: oklch(93% 0.04 25);
  --purple: oklch(55% 0.14 300);
  --purple-light: oklch(92% 0.04 300);
  --orange: oklch(65% 0.15 55);
  --orange-light: oklch(93% 0.04 55);
  --pink: oklch(60% 0.14 350);
  --pink-light: oklch(93% 0.04 350);
  --font-display: 'Söhne', 'Avenir Next', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', monospace;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--fg); line-height: 1.6; }
h1, h2, h3, h4, h5 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; }
.app-layout { display: flex; min-height: 100vh; }
/* Sidebar */
.sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
.sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
.sidebar-header h2 { font-size: 18px; letter-spacing: -0.01em; margin-bottom: 4px; }
.sidebar-header p { font-size: 13px; color: var(--muted); letter-spacing: 0.01em; }
.sidebar-stats { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; }
.stat-pill { display: flex; align-items: center; gap: 6px; background: var(--bg); padding: 6px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; }
.stat-pill .icon { font-size: 16px; }
.stat-pill .val { font-family: var(--font-mono); font-size: 12px; }
.sidebar-nav { padding: 12px 0; }
.nav-lesson { display: block; padding: 12px 20px; text-decoration: none; color: var(--fg); font-size: 14px; font-weight: 500; border-left: 3px solid transparent; transition: all 0.2s; cursor: pointer; }
.nav-lesson:hover { background: var(--bg); }
.nav-lesson.active { background: var(--accent-light); border-left-color: var(--accent); color: var(--accent-dark); }
.nav-lesson .lesson-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: block; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
.nav-lesson .lesson-title { font-weight: 500; }
.nav-lesson .lesson-progress { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.nav-lesson .progress-bar-bg { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.nav-lesson .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
.nav-lesson .progress-pct { font-size: 11px; color: var(--muted); font-family: var(--font-mono); min-width: 30px; text-align: right; }
.sidebar-badges { padding: 16px 20px; border-top: 1px solid var(--border); }
.sidebar-badges h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
.badge-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.badge-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; background: var(--bg); border: 1px solid var(--border); opacity: 0.4; transition: all 0.3s; }
.badge-icon.unlocked { opacity: 1; border-color: var(--accent); background: var(--accent-light); }
/* Main content */
.main-content { margin-left: 280px; flex: 1; min-height: 100vh; }
.top-bar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; }
.top-bar-left { display: flex; align-items: center; gap: 12px; }
.top-bar-left h1 { font-size: 16px; font-weight: 600; }
.top-bar-right { display: flex; align-items: center; gap: 16px; }
.overall-progress { display: flex; align-items: center; gap: 8px; }
.overall-progress .bar { width: 120px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.overall-progress .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }
.overall-progress .pct { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.hamburger { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--fg); padding: 4px; }
/* Lesson content */
.lesson-container { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
.lesson-hero { text-align: center; padding: 40px 20px 32px; margin-bottom: 32px; }
.lesson-hero .lesson-badge { display: inline-block; background: var(--accent-light); color: var(--accent-dark); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
.lesson-hero h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; margin-bottom: 8px; }
.lesson-hero p { color: var(--muted); font-size: 16px; max-width: 600px; margin: 0 auto; }
/* Sections */
.lesson-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.section-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.section-icon.mission { background: var(--accent-light); color: var(--accent-dark); }
.section-icon.warmup { background: var(--orange-light); color: var(--orange); }
.section-icon.vocab { background: var(--success-light); color: var(--success); }
.section-icon.pattern { background: var(--purple-light); color: var(--purple); }
.section-icon.grammar { background: var(--warn-light); color: var(--warn); }
.section-icon.activity { background: var(--pink-light); color: var(--pink); }
.section-icon.listening { background: var(--accent-light); color: var(--accent); }
.section-icon.speaking { background: var(--orange-light); color: var(--orange); }
.section-icon.challenge { background: var(--danger-light); color: var(--danger); }
.section-icon.reflection { background: var(--purple-light); color: var(--purple); }
.section-icon.project { background: var(--success-light); color: var(--success); }
.section-icon.progress { background: var(--warn-light); color: var(--warn); }
.section-icon.gamification { background: var(--pink-light); color: var(--pink); }
.section-header h2 { font-size: 20px; letter-spacing: -0.01em; }
.section-header .section-tag { font-size: 11px; background: var(--bg); color: var(--muted); padding: 2px 8px; border-radius: 10px; margin-left: auto; font-weight: 500; }
/* Mission card */
.mission-card { background: linear-gradient(135deg, var(--accent-light), oklch(95% 0.03 170)); border-radius: var(--radius-md); padding: 24px; text-align: center; }
.mission-card .mission-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-dark); font-weight: 600; margin-bottom: 8px; }
.mission-card .mission-text { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--fg); margin-bottom: 12px; }
.mission-card .objective { font-size: 14px; color: var(--muted); }
.mission-card .objective strong { color: var(--fg); }
/* Vocab grid */
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.vocab-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; text-align: center; transition: all 0.2s; cursor: pointer; }
.vocab-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.vocab-card .emoji { font-size: 32px; margin-bottom: 8px; display: block; }
.vocab-card .spanish { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--fg); }
.vocab-card .english { font-size: 13px; color: var(--muted); margin-top: 2px; }
.vocab-card .pronunciation { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-top: 4px; }
.vocab-card .sentence { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; border-top: 1px solid var(--border); padding-top: 8px; }
/* Audio button */
.audio-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.audio-btn:hover { background: var(--accent-dark); }
.audio-btn.playing { animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
/* Pattern cards */
.pattern-list { display: flex; flex-direction: column; gap: 12px; }
.pattern-item { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
.pattern-num { width: 28px; height: 28px; background: var(--purple-light); color: var(--purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.pattern-text { font-family: var(--font-display); font-size: 17px; font-weight: 500; }
.pattern-translation { font-size: 13px; color: var(--muted); }
/* Grammar box */
.grammar-box { background: var(--warn-light); border: 1px solid oklch(85% 0.04 75); border-radius: var(--radius-md); padding: 20px; }
.grammar-box h3 { font-size: 16px; color: var(--warn); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.grammar-example { background: white; border-radius: var(--radius-sm); padding: 12px 16px; margin-top: 8px; font-size: 14px; }
.grammar-example .es { font-weight: 600; color: var(--fg); }
.grammar-example .en { color: var(--muted); font-size: 13px; }
/* Flashcard */
.flashcard-container { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.flashcard-wrapper { perspective: 1000px; width: 100%; max-width: 400px; height: 240px; cursor: pointer; }
.flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; }
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.flashcard-front { background: linear-gradient(135deg, var(--accent-light), oklch(94% 0.03 170)); border: 2px solid var(--accent); }
.flashcard-front .fc-emoji { font-size: 48px; margin-bottom: 12px; }
.flashcard-front .fc-word { font-family: var(--font-display); font-size: 28px; font-weight: 600; }
.flashcard-front .fc-hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.flashcard-back { background: linear-gradient(135deg, var(--success-light), oklch(94% 0.03 145)); border: 2px solid var(--success); transform: rotateY(180deg); }
.flashcard-back .fc-word { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--success); margin-bottom: 8px; }
.flashcard-back .fc-pronunciation { font-family: var(--font-mono); font-size: 16px; color: var(--muted); margin-bottom: 8px; }
.flashcard-back .fc-sentence { font-size: 14px; color: var(--fg); text-align: center; font-style: italic; }
.flashcard-nav { display: flex; gap: 12px; align-items: center; }
.flashcard-nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font-size: 18px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
.flashcard-nav button:hover { background: var(--accent-light); border-color: var(--accent); }
.flashcard-counter { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
/* Quiz */
.quiz-container { display: flex; flex-direction: column; gap: 16px; }
.quiz-question { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-option { background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; cursor: pointer; transition: all 0.2s; font-size: 15px; text-align: left; width: 100%; }
.quiz-option:hover { border-color: var(--accent); background: var(--accent-light); }
.quiz-option.correct { border-color: var(--success); background: var(--success-light); color: var(--success); }
.quiz-option.incorrect { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
.quiz-option:disabled { cursor: default; opacity: 0.7; }
.quiz-feedback { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; display: none; }
.quiz-feedback.show { display: block; }
.quiz-feedback.correct { background: var(--success-light); color: var(--success); }
.quiz-feedback.incorrect { background: var(--danger-light); color: var(--danger); }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.quiz-score { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
/* Fill blank */
.fill-blank { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 16px; line-height: 2; }
.fill-blank input { border: none; border-bottom: 2px solid var(--border); background: transparent; font-size: 16px; font-family: var(--font-body); padding: 2px 8px; width: 140px; text-align: center; transition: border-color 0.2s; outline: none; }
.fill-blank input:focus { border-bottom-color: var(--accent); }
.fill-blank input.correct { border-bottom-color: var(--success); color: var(--success); }
.fill-blank input.incorrect { border-bottom-color: var(--danger); color: var(--danger); }
.fill-blank .word { font-weight: 500; }
/* Drag & drop matching */
.match-container { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.match-column { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
.match-item { background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; font-size: 14px; text-align: center; transition: all 0.2s; }
.match-item.draggable { cursor: grab; user-select: none; }
.match-item.draggable:hover { border-color: var(--accent); background: var(--accent-light); }
.match-item.draggable:active { cursor: grabbing; }
.match-item.draggable.dragging { opacity: 0.5; }
.match-item.dropzone { min-height: 48px; border-style: dashed; }
.match-item.dropzone.over { border-color: var(--accent); background: var(--accent-light); }
.match-item.matched { border-color: var(--success); background: var(--success-light); cursor: default; }
.match-item.wrong { border-color: var(--danger); background: var(--danger-light); animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.match-score { text-align: center; margin-top: 12px; font-size: 14px; color: var(--muted); }
/* Sentence builder */
.sentence-builder { display: flex; flex-direction: column; gap: 12px; }
.sentence-prompt { font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.sentence-target { font-family: var(--font-display); font-size: 18px; font-weight: 500; padding: 12px 16px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border); min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sentence-target .placed-word { background: var(--accent-light); color: var(--accent-dark); padding: 4px 12px; border-radius: 16px; font-size: 14px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--accent); }
.sentence-target .placed-word:hover { background: var(--danger-light); border-color: var(--danger); }
.word-bank { display: flex; flex-wrap: wrap; gap: 8px; }
.word-chip { background: var(--surface); border: 2px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 14px; cursor: pointer; transition: all 0.2s; user-select: none; }
.word-chip:hover { border-color: var(--accent); background: var(--accent-light); }
.word-chip.used { opacity: 0.3; pointer-events: none; }
/* Dialogue */
.dialogue { display: flex; flex-direction: column; gap: 12px; }
.dialogue-line { display: flex; gap: 12px; align-items: flex-start; }
.dialogue-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.dialogue-avatar.papa { background: var(--accent-light); color: var(--accent-dark); }
.dialogue-avatar.hija { background: var(--pink-light); color: var(--pink); }
.dialogue-bubble { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; max-width: 80%; }
.dialogue-bubble .es { font-size: 15px; font-weight: 500; }
.dialogue-bubble .en { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dialogue-speed { display: flex; gap: 8px; margin-bottom: 12px; }
.speed-btn { padding: 6px 14px; border: 1px solid var(--border); background: var(--surface); border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
/* Speaking practice */
.roleplay-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 12px; }
.roleplay-card h4 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.roleplay-card .scenario { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.roleplay-lines { display: flex; flex-direction: column; gap: 6px; }
.roleplay-line { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.roleplay-line .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); min-width: 50px; }
.roleplay-line .text { font-weight: 500; }
/* Challenge card */
.challenge-card { background: linear-gradient(135deg, var(--danger-light), oklch(95% 0.03 25)); border: 1px solid oklch(85% 0.04 25); border-radius: var(--radius-md); padding: 24px; }
.challenge-card h3 { color: var(--danger); font-size: 16px; margin-bottom: 16px; }
.challenge-list { list-style: none; padding: 0; }
.challenge-list li { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.challenge-list li:last-child { border-bottom: none; }
.challenge-list .ask { color: var(--accent-dark); font-weight: 500; }
.challenge-list .say { color: var(--success); font-weight: 500; }
/* Reflection */
.reflection-form { display: flex; flex-direction: column; gap: 12px; }
.reflection-form label { font-size: 14px; font-weight: 500; }
.reflection-form textarea { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-family: var(--font-body); font-size: 14px; resize: vertical; min-height: 60px; outline: none; transition: border-color 0.2s; }
.reflection-form textarea:focus { border-color: var(--accent); }
/* Progress bars */
.progress-section { display: flex; flex-direction: column; gap: 16px; }
.progress-item { display: flex; align-items: center; gap: 12px; }
.progress-item .label { font-size: 14px; min-width: 140px; font-weight: 500; }
.progress-item .bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-item .fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.progress-item .value { font-size: 13px; color: var(--muted); font-family: var(--font-mono); min-width: 40px; text-align: right; }
/* XP & Gamification */
.xp-bar { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: linear-gradient(135deg, var(--purple-light), oklch(94% 0.03 300)); border-radius: var(--radius-md); margin-bottom: 16px; }
.xp-bar .level { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--purple); }
.xp-bar .level-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.xp-bar .xp-progress { flex: 1; }
.xp-bar .xp-text { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.xp-bar .bar { height: 8px; background: rgba(255,255,255,0.5); border-radius: 4px; overflow: hidden; }
.xp-bar .fill { height: 100%; background: var(--purple); border-radius: 4px; transition: width 0.5s; }
.badges-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.badge-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); min-width: 100px; text-align: center; transition: all 0.3s; }
.badge-card.unlocked { border-color: var(--accent); background: var(--accent-light); }
.badge-card .badge-emoji { font-size: 32px; }
.badge-card .badge-name { font-size: 12px; font-weight: 500; }
.badge-card .badge-desc { font-size: 11px; color: var(--muted); }
/* Celebration animation */
.celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
.confetti { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: confetti-fall 3s ease-out forwards; }
@keyframes confetti-fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
/* English subtitles */
.en-subtitle { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 4px; line-height: 1.4; }
.en-subtitle-inline { font-size: 12px; color: var(--muted); font-style: italic; }
.en-badge { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px 8px; font-size: 11px; color: var(--muted); font-style: italic; margin-top: 4px; letter-spacing: 0.01em; }
.section-subtitle { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 12px; padding: 8px 12px; background: var(--bg); border-radius: var(--radius-sm); border-left: 3px solid var(--border); }
/* Toast */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 20px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; font-size: 14px; animation: slideIn 0.3s ease; }
.toast.xp { border-left: 4px solid var(--purple); }
.toast.badge { border-left: 4px solid var(--accent); }
.toast.success { border-left: 4px solid var(--success); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
/* Buttons */
.btn-primary-custom { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.btn-primary-custom:hover { background: var(--accent-dark); }
.btn-secondary-custom { background: var(--surface); color: var(--fg); border: 1px solid var(--border); padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.btn-secondary-custom:hover { background: var(--bg); }
.btn-check { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-check:hover { background: oklch(48% 0.15 145); }
/* Welcome screen */
.welcome-screen { text-align: center; padding: 60px 20px; }
.welcome-screen .welcome-icon { font-size: 64px; margin-bottom: 20px; }
.welcome-screen h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; margin-bottom: 12px; }
.welcome-screen p { font-size: 16px; color: var(--muted); max-width: 500px; margin: 0 auto 24px; }
.welcome-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 32px; }
.welcome-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; text-align: left; cursor: pointer; transition: all 0.2s; }
.welcome-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.welcome-card .wc-num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.welcome-card h3 { font-size: 17px; margin-bottom: 4px; }
.welcome-card p { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.welcome-card .wc-progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.welcome-card .wc-progress .fill { height: 100%; background: var(--accent); border-radius: 2px; }
/* Responsive */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .main-content { margin-left: 0; }
  .hamburger { display: block; }
  .top-bar { padding: 12px 16px; }
  .lesson-container { padding: 16px 12px 60px; }
  .lesson-section { padding: 20px 16px; }
  .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .match-container { flex-direction: column; }
  .dialogue-bubble { max-width: 90%; }
  .welcome-cards { grid-template-columns: 1fr; }
  .overall-progress .bar { width: 80px; }
}
/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>

const LEVELS = [

// ========== STATE ==========
let state = {
  currentLesson: null,
  xp: 0,
  streak: 0,
  lastVisit: null,
  lessonProgress: {},
  badges: [],
  quizScores: {},
  reflectionCount: 0,
  sentenceCount: 0,
  matchCount: 0,
  speakingDone: false,
  listeningDone: false,
  perfectQuiz: false,
  wordsLearned: 0
};

function loadState() {
  try {
    const saved = localStorage.getItem('conectando-espanol');
    if (saved) state = { ...state, ...JSON.parse(saved) };
    updateStreak();
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem('conectando-espanol', JSON.stringify(state)); } catch(e) {}
}

function updateStreak() {
  const today = new Date().toDateString();
  if (state.lastVisit === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (state.lastVisit === yesterday) {
    state.streak++;
  } else if (state.lastVisit !== today) {
    state.streak = 1;
  }
  state.lastVisit = today;
  saveState();
}

// ========== XP & LEVELS ==========
function addXP(amount, source) {
  state.xp += amount;
  saveState();
  showToast(`+${amount} XP — ${source}`, 'xp');
  checkBadges();
  updateUI();
  if (amount >= 20) triggerCelebration();
}

function getLevel() {
  let lvl = LEVELS[0];
  for (const l of LEVELS) {
    if (state.xp >= l.xp) lvl = l;
  }
  return lvl;
}

function getNextLevel() {
  const lvl = getLevel();
  const idx = LEVELS.findIndex(l => l.level === lvl.level);
  return idx < LEVELS.length - 1 ? LEVELS[idx + 1] : null;
}

function getXPProgress() {
  const lvl = getLevel();
  const next = getNextLevel();
  if (!next) return 100;
  return Math.min(100, ((state.xp - lvl.xp) / (next.xp - lvl.xp)) * 100);
}

// ========== BADGES ==========
function checkBadges() {
  const totalWords = state.wordsLearned || 0;
  const newBadges = [];

  function tryUnlock(id) {
    if (!state.badges.includes(id)) {
      state.badges.push(id);
      newBadges.push(id);
    }
  }

  if (state.xp >= 50) tryUnlock('first-lesson');
  if (totalWords >= 30) tryUnlock('vocab-master');
  if (state.streak >= 3) tryUnlock('streak-3');
  if (state.streak >= 7) tryUnlock('streak-7');
  if (state.perfectQuiz) tryUnlock('perfect-quiz');
  if (state.speakingDone) tryUnlock('speaker');
  if (state.listeningDone) tryUnlock('listener');
  if (state.reflectionCount >= 3) tryUnlock('reflective');
  if (state.sentenceCount >= 10) tryUnlock('builder');
  if (state.matchCount >= 5) tryUnlock('match-master');

  const completedLessons = Object.values(state.lessonProgress).filter(p => p >= 100).length;
  if (completedLessons >= 5) tryUnlock('all-done');
  if (completedLessons >= 5) tryUnlock('five-lessons');

  newBadges.forEach(id => {
    const badge = BADGES.find(b => b.id === id);
    if (badge) showToast(`Insignia desbloqueada / Badge unlocked: ${badge.emoji} ${badge.name}`, 'badge');
  });

  saveState();
}

// ========== PROGRESS ==========
function getLessonProgress(lessonIdx) {
  return state.lessonProgress[lessonIdx] || 0;
}

function markSectionComplete(lessonIdx, section) {
  if (!state.lessonProgress[lessonIdx]) state.lessonProgress[lessonIdx] = {};
  if (!state.lessonProgress[lessonIdx].sections) state.lessonProgress[lessonIdx].sections = {};

  if (state.lessonProgress[lessonIdx].sections[section]) return;
  state.lessonProgress[lessonIdx].sections[section] = true;

  const totalSections = 14;
  const completed = Object.keys(state.lessonProgress[lessonIdx].sections).length;
  state.lessonProgress[lessonIdx] = Math.min(100, Math.round((completed / totalSections) * 100));

  saveState();
  updateUI();
}

function getOverallProgress() {
  const total = COURSE_DATA.length * 100;
  let done = 0;
  for (let i = 0; i < COURSE_DATA.length; i++) {
    done += getLessonProgress(i);
  }
  return Math.round((done / total) * 100);
}

// ========== INTERACTIVITY ==========
let flashcardState = {};
let quizState = {};

function initLessonInteractivity(idx) {
  initQuiz(idx);
  initFillBlank(idx);
  initMatch(idx);
  initSentenceBuilder(idx);
  flashcardState[idx] = { current: 0, flipped: false };
}

// Flashcards
function flipFlashcard(wrapper) {
  const fc = wrapper.querySelector('.flashcard');
  fc.classList.toggle('flipped');
}

function nextFlashcard(idx) {
  const lesson = COURSE_DATA[idx];
  const s = flashcardState[idx] || { current: 0 };
  s.current = (s.current + 1) % lesson.vocabulary.length;
  flashcardState[idx] = s;
  updateFlashcard(idx);
}

function prevFlashcard(idx) {
  const lesson = COURSE_DATA[idx];
  const s = flashcardState[idx] || { current: 0 };
  s.current = (s.current - 1 + lesson.vocabulary.length) % lesson.vocabulary.length;
  flashcardState[idx] = s;
  updateFlashcard(idx);
}

function updateFlashcard(idx) {
  const lesson = COURSE_DATA[idx];
  const s = flashcardState[idx];
  const v = lesson.vocabulary[s.current];
  document.getElementById(`fc-emoji-${idx}`).textContent = v.emoji;
  document.getElementById(`fc-word-${idx}`).textContent = v.es;
  document.getElementById(`fc-word-en-${idx}`).textContent = v.en;
  document.getElementById(`fc-pron-${idx}`).textContent = v.pron;
  document.getElementById(`fc-sent-${idx}`).textContent = `"${v.sentence}"`;
  document.getElementById(`fc-counter-${idx}`).textContent = `${s.current + 1} / ${lesson.vocabulary.length}`;
  const fc = document.getElementById(`flashcard-${idx}`);
  fc.classList.remove('flipped');
}

// Quiz
function initQuiz(idx) {
  const lesson = COURSE_DATA[idx];
  const questions = generateQuizQuestions(lesson, idx);
  quizState[idx] = { questions, current: 0, score: 0, answered: false };
  renderQuizQuestion(idx);
}

function generateQuizQuestions(lesson, idx) {
  const vocab = lesson.vocabulary;
  const questions = [];
  for (let i = 0; i < Math.min(5, vocab.length); i++) {
    const correct = vocab[i];
    const others = vocab.filter((_, j) => j !== i);
    const shuffled = others.sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [correct.en, ...shuffled.map(v => v.en)].sort(() => Math.random() - 0.5);
    questions.push({
      question: `¿Qué significa "${correct.es}"?`,
      question_en: `What does "${correct.es}" mean?`,
      options,
      correct: correct.en
    });
  }
  return questions;
}

function renderQuizQuestion(idx) {
  const qs = quizState[idx];
  if (!qs || qs.current >= qs.questions.length) {
    document.getElementById(`quiz-q-${idx}`).innerHTML = `¡Quiz completado! Puntuación: ${qs.score}/${qs.questions.length}<br><span class="en-subtitle">Quiz complete! Score: ${qs.score}/${qs.questions.length}</span>`;
    document.getElementById(`quiz-opts-${idx}`).innerHTML = '';
    document.getElementById(`quiz-fb-${idx}`).className = 'quiz-feedback';
    document.getElementById(`quiz-next-${idx}`).style.display = 'none';
    const pct = qs.score / qs.questions.length;
    state.quizScores[idx] = pct;
    if (pct === 1) state.perfectQuiz = true;
    addXP(qs.score * 10, 'Quiz');
    checkBadges();
    saveState();
    return;
  }
  const q = qs.questions[qs.current];
  document.getElementById(`quiz-q-${idx}`).innerHTML = `${q.question}<br><span class="en-subtitle">${q.question_en || ''}</span>`;
  document.getElementById(`quiz-opts-${idx}`).innerHTML = q.options.map((opt, oi) =>
    `<button class="quiz-option" onclick="answerQuiz(${idx}, '${opt.replace(/'/g, "\\'")}', this)">${opt}</button>`
  ).join('');
  document.getElementById(`quiz-fb-${idx}`).className = 'quiz-feedback';
  document.getElementById(`quiz-fb-${idx}`).textContent = '';
  document.getElementById(`quiz-next-${idx}`).style.display = 'none';
  document.getElementById(`quiz-score-${idx}`).textContent = `Pregunta ${qs.current + 1} / ${qs.questions.length} — Question ${qs.current + 1} of ${qs.questions.length}`;
  quizState[idx].answered = false;
}

function answerQuiz(idx, answer, btn) {
  const qs = quizState[idx];
  if (qs.answered) return;
  qs.answered = true;
  const q = qs.questions[qs.current];
  const fb = document.getElementById(`quiz-fb-${idx}`);
  const buttons = document.querySelectorAll(`#quiz-opts-${idx} .quiz-option`);
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('correct');
  });
  if (answer === q.correct) {
    btn.classList.add('correct');
    fb.className = 'quiz-feedback show correct';
    fb.textContent = '¡Correcto! / Correct! 🎉';
    qs.score++;
  } else {
    btn.classList.add('incorrect');
    fb.className = 'quiz-feedback show incorrect';
    fb.textContent = `Incorrecto. La respuesta correcta es: ${q.correct} / Wrong. The correct answer is: ${q.correct}`;
  }
  document.getElementById(`quiz-next-${idx}`).style.display = 'inline-block';
}

function nextQuizQuestion(idx) {
  quizState[idx].current++;
  renderQuizQuestion(idx);
}

// Fill in the Blank
function initFillBlank(idx) {
  const lesson = COURSE_DATA[idx];
  const container = document.getElementById(`fillblank-${idx}`);
  if (!container) return;

  const items = lesson.patterns.slice(0, 3).map((p, pi) => {
    const words = p.es.split(' ');
    const blankIdx = Math.floor(words.length / 2);
    const blankWord = words[blankIdx];
    words[blankIdx] = '_____';
    return { words, blankWord, translation: p.en };
  });

  container.innerHTML = items.map((item, ii) => `
    <div style="margin-bottom:16px;padding:16px;background:var(--bg);border-radius:var(--radius-md);border:1px solid var(--border)">
      <div style="font-size:13px;color:var(--muted);margin-bottom:4px">${item.translation}</div>
      <div class="fill-blank">
        ${item.words.map((w, wi) => w === '_____'
          ? `<input type="text" id="fb-${idx}-${ii}" placeholder="?" onkeydown="if(event.key==='Enter')checkFillBlank(${idx},${ii},'${item.blankWord}')">`
          : `<span class="word">${w}</span>`
        ).join(' ')}
      </div>
      <button class="btn-check" onclick="checkFillBlank(${idx},${ii},'${item.blankWord}')" style="margin-top:8px">Comprobar / Check</button>
    </div>
  `).join('');
}

function checkFillBlank(idx, qi, correct) {
  const input = document.getElementById(`fb-${idx}-${qi}`);
  if (!input) return;
  const val = input.value.trim().toLowerCase();
  if (val === correct.toLowerCase()) {
    input.classList.add('correct');
    input.classList.remove('incorrect');
    addXP(5, 'Relleno correcto / Fill-in correct');
    markSectionComplete(idx, 'activities');
  } else {
    input.classList.add('incorrect');
    input.classList.remove('correct');
    input.value = correct;
  }
}

// Drag & Drop Match
function initMatch(idx) {
  const lesson = COURSE_DATA[idx];
  const container = document.getElementById(`match-${idx}`);
  if (!container) return;

  const pairs = lesson.vocabulary.slice(0, 5).map(v => ({ es: v.es, en: v.en }));
  const shuffledEn = [...pairs].sort(() => Math.random() - 0.5);

  container.innerHTML = `
    <div class="match-column" id="match-left-${idx}">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:4px">ESPAÑOL</div>
      ${pairs.map((p, pi) => `
        <div class="match-item draggable" draggable="true" data-word="${p.en}" id="match-es-${idx}-${pi}">${p.es}</div>
      `).join('')}
    </div>
    <div class="match-column" id="match-right-${idx}">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:4px">ENGLISH</div>
      ${shuffledEn.map((p, pi) => `
        <div class="match-item dropzone" data-answer="${p.en}" id="match-en-${idx}-${pi}">${p.en}</div>
      `).join('')}
    </div>
    <div style="width:100%;text-align:center;font-size:12px;color:var(--muted);margin-top:4px">Drag Spanish words to their English match / Arrastra las palabras españolas a su equivalente en inglés</div>`;

  let matchCorrect = 0;
  let draggedItem = null;

  container.querySelectorAll('.draggable').forEach(item => {
    item.addEventListener('dragstart', e => {
      draggedItem = item;
      item.classList.add('dragging');
      e.dataTransfer.setData('text/plain', item.dataset.word);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      draggedItem = null;
    });
  });

  container.querySelectorAll('.dropzone').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      const word = e.dataTransfer.getData('text/plain');
      if (word === zone.dataset.answer) {
        zone.classList.add('matched');
        if (draggedItem) draggedItem.classList.add('matched');
        matchCorrect++;
        addXP(5, 'Match correcto / Match correct');
        if (matchCorrect >= pairs.length) {
          document.getElementById(`match-score-${idx}`).innerHTML = '¡Perfecto! Todos emparejados. 🎉<br><span class="en-subtitle">Perfect! All matched.</span>';
          state.matchCount = (state.matchCount || 0) + 1;
          checkBadges();
          saveState();
        }
      } else {
        zone.classList.add('wrong');
        setTimeout(() => zone.classList.remove('wrong'), 500);
      }
    });
  });
}

// Sentence Builder
function initSentenceBuilder(idx) {
  const lesson = COURSE_DATA[idx];
  const container = document.getElementById(`sentence-${idx}`);
  if (!container) return;

  const sentence = lesson.patterns[0];
  const words = sentence.es.replace(/[¿¡?!,.]/g, '').split(' ');
  const shuffled = [...words].sort(() => Math.random() - 0.5);

  container.innerHTML = `
    <div class="sentence-prompt">Traduce: "${sentence.en}"</div>
    <div class="en-subtitle" style="margin-bottom:8px">Translate: "${sentence.en}"</div>
    <div class="sentence-target" id="sentence-target-${idx}"></div>
    <div class="word-bank" id="word-bank-${idx}">
      ${shuffled.map((w, wi) => `
        <div class="word-chip" onclick="addWordToSentence(${idx}, '${w}', this)">${w}</div>
      `).join('')}
    </div>
    <button class="btn-check" onclick="checkSentence(${idx}, '${words.join(' ')}')">Comprobar / Check</button>`;
}

function addWordToSentence(idx, word, chip) {
  const target = document.getElementById(`sentence-target-${idx}`);
  const placed = document.createElement('span');
  placed.className = 'placed-word';
  placed.textContent = word;
  placed.onclick = () => {
    placed.remove();
    chip.classList.remove('used');
  };
  target.appendChild(placed);
  chip.classList.add('used');
}

function checkSentence(idx, correct) {
  const target = document.getElementById(`sentence-target-${idx}`);
  const placed = Array.from(target.querySelectorAll('.placed-word')).map(el => el.textContent);
  const attempt = placed.join(' ');
  if (attempt === correct) {
    addXP(10, 'Oración correcta / Sentence correct');
    state.sentenceCount = (state.sentenceCount || 0) + 1;
    checkBadges();
    saveState();
    showToast('¡Oración correcta! / Sentence correct! 🎉', 'success');
  } else {
    showToast('Intenta de nuevo / Try again — las palabras no están en el orden correcto / words are not in the right order.', 'incorrect');
  }
}

// Dialogue speed
let dialogueSpeeds = {};
function setDialogueSpeed(speed, idx) {
  dialogueSpeeds[idx] = speed;
  document.getElementById(`speed-slow-${idx}`).classList.toggle('active', speed === 'slow');
  document.getElementById(`speed-natural-${idx}`).classList.toggle('active', speed === 'natural');
}

function playDialogue(idx) {
  const lesson = COURSE_DATA[idx];
  const speed = dialogueSpeeds[idx] === 'slow' ? 0.7 : 1;
  lesson.dialogue.forEach((d, i) => {
    setTimeout(() => speak(d.es, speed), i * 3000);
  });
  state.listeningDone = true;
  checkBadges();
  saveState();
}

// Text-to-speech
function speak(text, rate = 1) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'es-ES';
    utter.rate = rate;
    const voices = window.speechSynthesis.getVoices();
    const esVoice = voices.find(v => v.lang.startsWith('es'));
    if (esVoice) utter.voice = esVoice;
    window.speechSynthesis.speak(utter);
  }
}

// Learn word
function learnWord(idx, vi) {
  if (!state.wordsLearned) state.wordsLearned = 0;
  state.wordsLearned = Math.min(50, state.wordsLearned + 1);
  saveState();
  checkBadges();
}

// Complete speaking
function completeSpeaking(idx) {
  state.speakingDone = true;
  addXP(15, 'Práctica de speaking / Speaking practice');
  checkBadges();
  saveState();
  showToast('¡Práctica de speaking completada! / Speaking practice completed! 🗣️', 'success');
}

// Reflection
function autoSaveReflection(idx) {}

function saveReflection(idx) {
  state.reflectionCount = (state.reflectionCount || 0) + 1;
  addXP(10, 'Reflexión guardada / Reflection saved');
  checkBadges();
  saveState();
  showToast('Reflexión guardada. ¡Buen trabajo! / Reflection saved. Great job! 💭', 'success');
}

// Mark lesson complete
function markLessonComplete(idx) {
  for (let s = 0; s < 14; s++) {
    markSectionComplete(idx, s);
  }
  state.lessonProgress[idx] = 100;
  addXP(25, `Lección ${idx + 1} completada / Lesson ${idx + 1} completed`);
  checkBadges();
  saveState();
  showToast(`¡Lección ${idx + 1} completada! / Lesson ${idx + 1} completed! 🎉`, 'success');
  triggerCelebration();
  renderSidebar();
}

// ========== NAVIGATION ==========
function navigateToLesson(idx) {
  state.currentLesson = idx;
  saveState();
  renderSidebar();
  renderLesson(idx);
  closeSidebar();
}

function navigateHome() {
  state.currentLesson = null;
  saveState();
  renderSidebar();
  renderWelcome();
  closeSidebar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

// ========== UI UPDATES ==========
function updateUI() {
  const lvl = getLevel();
  document.getElementById('sidebar-xp').textContent = `${state.xp} XP`;
  document.getElementById('sidebar-streak').textContent = `${state.streak} días`;
  document.getElementById('sidebar-level').textContent = `Nivel ${lvl.level}`;
  const overall = getOverallProgress();
  document.getElementById('overall-fill').style.width = `${overall}%`;
  document.getElementById('overall-pct').textContent = `${overall}%`;
  renderSidebar();
}

// ========== TOAST ==========
function showToast(message, type = 'xp') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ========== CELEBRATION ==========
function triggerCelebration() {
  const container = document.getElementById('celebration');
  const colors = ['var(--accent)', 'var(--success)', 'var(--purple)', 'var(--orange)', 'var(--pink)', 'var(--warn)'];
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = '-10px';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 1 + 's';
    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(confetti);
  }
  setTimeout(() => container.innerHTML = '', 4000);
}

// ========== INIT ==========
loadState();
if (state.currentLesson !== null) {
  renderLesson(state.currentLesson);
} else {
  renderWelcome();
}
renderSidebar();
updateUI();

// Load voices for TTS
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
